name: Build OutfitStudio and BodySlide

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - config: Release
            arch: x64
            vcpkg_triplet: x64-windows
          - config: Release
            arch: Win32
            vcpkg_triplet: x86-windows
          - config: RelWithDebInfo
            arch: x64
            vcpkg_triplet: x64-windows
          - config: RelWithDebInfo
            arch: Win32
            vcpkg_triplet: x86-windows
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Install wxWidgets
        run: |
          vcpkg integrate install
          vcpkg install wxwidgets:${{ matrix.vcpkg_triplet }}

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake -G "Visual Studio 17 2022" -A ${{ matrix.arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DBSOS_ENABLE_FBXSDK=OFF `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg_triplet }} `
            ..

      - name: Build
        working-directory: build
        run: cmake --build . --config ${{ matrix.config }} --parallel

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.config }}-${{ matrix.arch }}
          path: build/${{ matrix.config }}/**/*.exe
          retention-days: 30
