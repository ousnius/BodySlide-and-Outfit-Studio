name: Build OutfitStudio and BodySlide x64

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        config: [Release, RelWithDebInfo]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install wxWidgets x64
        run: |
          vcpkg integrate install
          vcpkg install wxwidgets:x64-windows

      - name: Create build directory
        run: mkdir build

      - name: Configure CMake
        working-directory: build
        run: |
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DBSOS_ENABLE_FBXSDK=OFF `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            ..

      - name: Build
        working-directory: build
        run: cmake --build . --config ${{ matrix.config }} --parallel

      - name: Copy res folder
        run: |
          xcopy res build\${{ matrix.config }}\res /E /I /Y

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.config }}-x64
          path: build/${{ matrix.config }}/
          retention-days: 30
