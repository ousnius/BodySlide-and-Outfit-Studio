name: CMake RelWithDebInfo

on:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-x64-relwithdebinfo:
    name: Windows x64 RelWithDebInfo
    runs-on: windows-2025-vs2026

    # packages: the vcpkg binary cache in GitHub Packages
    permissions:
      contents: read
      packages: write

    env:
      BUILD_TYPE: RelWithDebInfo
      # Static like x64-windows-static, but release libraries only (.github/vcpkg-triplets)
      VCPKG_TARGET_TRIPLET: x64-windows-static-release
      # A vcpkg release, so the packages stay the same between runs and their binary cache can be reused. Update it
      # to get newer packages: everything is built once then, and cached again.
      VCPKG_COMMIT: 9eec002df1cd109f8f104cd966a763daf9751489 # 2026.10.16

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: List Git LFS objects
        shell: bash
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull Git LFS objects
        run: git lfs pull

      # The packages vcpkg built before, one file each, named after vcpkg's hash of everything that went into it
      # (port, triplet, compiler, dependencies). The newest cache is restored; packages that no longer match are
      # rebuilt and a new cache is saved after the install.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v5
        with:
          path: vcpkg-binary-cache
          key: vcpkg-files-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-
          restore-keys: |
            vcpkg-files-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init --quiet $vcpkgRoot
          git -C $vcpkgRoot fetch --quiet --depth 1 https://github.com/microsoft/vcpkg.git $env:VCPKG_COMMIT
          git -C $vcpkgRoot checkout --quiet FETCH_HEAD
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV

      # The second binary cache: GitHub Packages keeps each package on its own, for every branch, so packages
      # survive when the cache above is evicted or was saved by another branch
      - name: Add GitHub Packages as a NuGet source
        shell: pwsh
        run: |
          $nuget = & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") fetch nuget | Select-Object -Last 1
          $feed = "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          & $nuget sources add -Source $feed -StorePasswordInClearText -Name GitHubPackages `
            -UserName "${{ github.repository_owner }}" -Password "${{ secrets.GITHUB_TOKEN }}"
          & $nuget setapikey "${{ secrets.GITHUB_TOKEN }}" -Source $feed

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkgCache = Join-Path $env:GITHUB_WORKSPACE "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$vcpkgCache,readwrite;nuget,GitHubPackages,readwrite;nugettimeout,600"
          & (Join-Path $env:VCPKG_ROOT "vcpkg.exe") install `
            --overlay-triplets="$env:GITHUB_WORKSPACE/.github/vcpkg-triplets" `
            --triplet "$env:VCPKG_TARGET_TRIPLET" `
            "wxwidgets[debug-support]" catch2 bullet3 openexr

      # Keeps only the packages this install used, and names the cache after them, so it is saved again exactly
      # when something was rebuilt
      - name: Prune vcpkg binary cache
        id: vcpkg-prune
        shell: pwsh
        run: |
          $vcpkgCache = Join-Path $env:GITHUB_WORKSPACE "vcpkg-binary-cache"
          $status = Join-Path $env:VCPKG_ROOT "installed/vcpkg/status"
          $used = @(Select-String -Path $status -Pattern '^Abi: (\w+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          Get-ChildItem $vcpkgCache -Recurse -File | Where-Object { $used -notcontains $_.BaseName } | Remove-Item
          $kept = @(Get-ChildItem $vcpkgCache -Recurse -File | ForEach-Object BaseName | Sort-Object)
          $sha = [Security.Cryptography.SHA256]::Create()
          $hash = -join ($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($kept -join "`n")) | ForEach-Object { $_.ToString("x2") })
          "Keeping $($kept.Count) of $($used.Count) installed packages in the cache"
          "count=$($kept.Count)" >> $env:GITHUB_OUTPUT
          "key=vcpkg-files-${{ runner.os }}-$env:VCPKG_TARGET_TRIPLET-$hash" >> $env:GITHUB_OUTPUT

      - name: Save vcpkg binary cache
        if: steps.vcpkg-prune.outputs.count != '0' && steps.vcpkg-cache.outputs.cache-matched-key != steps.vcpkg-prune.outputs.key
        uses: actions/cache/save@v5
        with:
          path: vcpkg-binary-cache
          key: ${{ steps.vcpkg-prune.outputs.key }}

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchainFile = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/windows-x64-relwithdebinfo `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchainFile" `
            "-DCMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=RelWithDebInfo;Release;None;NOCONFIG" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DBSOS_BUILD_TESTS=ON `
            -DBSOS_ENABLE_FBXSDK=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-x64-relwithdebinfo --config "$env:BUILD_TYPE" --target BodySlide OutfitStudio BSOSTests --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-x64-relwithdebinfo -C "$env:BUILD_TYPE" --output-on-failure

      - name: Verify outputs
        shell: pwsh
        run: |
          $outputs = @(
            "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/BodySlide.exe",
            "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/OutfitStudio.exe"
          )

          foreach ($output in $outputs) {
            if (-not (Test-Path $output)) {
              Write-Error "Missing expected build output: $output"
            }
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $packageName = "BodySlide-and-Outfit-Studio-windows-x64-relwithdebinfo"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $packageDir = Join-Path $artifactRoot $packageName
          $artifactFile = Join-Path $artifactRoot "windows-x64-relwithdebinfo.zip"

          Remove-Item -Recurse -Force $artifactRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/BodySlide.exe" $packageDir
          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/OutfitStudio.exe" $packageDir
          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/*.pdb" $packageDir -ErrorAction SilentlyContinue
          Copy-Item "res" $packageDir -Recurse
          Copy-Item "lang" $packageDir -Recurse

          foreach ($file in @("BodySlide.xml", "BuildSelection.xml", "Config.xml", "OutfitStudio.xml", "RefTemplates.xml")) {
            Copy-Item $file $packageDir
          }

          foreach ($directory in @("SliderSets", "Automations", "PoseData", "RefTemplates", "ShapeData", "SliderCategories", "SliderGroups", "SliderPresets")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $packageDir $directory) | Out-Null
          }

          Push-Location $packageDir
          cmake -E tar cf $artifactFile --format=zip -- .
          Pop-Location

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/windows-x64-relwithdebinfo.zip
          archive: false
          if-no-files-found: error
          retention-days: 7



  ubuntu-gcc-relwithdebinfo:
    name: Ubuntu GCC RelWithDebInfo
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: RelWithDebInfo
      CC: gcc
      CXX: g++

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: List Git LFS objects
        run: git lfs ls-files --long | cut -d ' ' -f1 | sort > .lfs-objects

      - name: Cache Git LFS objects
        uses: actions/cache@v5
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.lfs-objects') }}

      - name: Pull Git LFS objects
        run: git lfs pull

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            cmake \
            directx-headers-dev \
            g++ \
            gcc \
            libbullet-dev \
            libglew-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libopenexr-dev \
            libwxgtk3.2-dev \
            ninja-build \
            pkg-config \
            catch2

          wx-config --version
          wx-config --selected-config
          wx-config --cxxflags
          wx-config --libs gl,core,base,net,xml,xrc,adv,qa,html,propgrid

      - name: Configure CMake
        run: |
          cmake -S . -B build/ubuntu-gcc-relwithdebinfo \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DBSOS_BUILD_TESTS=ON \
            -DBSOS_ENABLE_FBXSDK=OFF

      - name: Build
        run: cmake --build build/ubuntu-gcc-relwithdebinfo --target BodySlide OutfitStudio BSOSTests --parallel

      - name: Test
        run: ctest --test-dir build/ubuntu-gcc-relwithdebinfo --output-on-failure

      - name: Verify outputs
        run: |
          test -x "build/ubuntu-gcc-relwithdebinfo/BodySlide"
          test -x "build/ubuntu-gcc-relwithdebinfo/OutfitStudio"

      - name: Package artifacts
        run: |
          package_name="BodySlide-and-Outfit-Studio-ubuntu-gcc-relwithdebinfo"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          package_dir="$artifact_root/$package_name"
          artifact_file="$artifact_root/ubuntu-gcc-relwithdebinfo.zip"

          rm -rf "$artifact_root"
          mkdir -p "$package_dir"

          cp "build/ubuntu-gcc-relwithdebinfo/BodySlide" "$package_dir/"
          cp "build/ubuntu-gcc-relwithdebinfo/OutfitStudio" "$package_dir/"
          cp -a res "$package_dir/"
          cp -a lang "$package_dir/"
          cp BodySlide.xml BuildSelection.xml Config.xml OutfitStudio.xml RefTemplates.xml "$package_dir/"

          mkdir -p \
            "$package_dir/SliderSets" \
            "$package_dir/Automations" \
            "$package_dir/PoseData" \
            "$package_dir/RefTemplates" \
            "$package_dir/ShapeData" \
            "$package_dir/SliderCategories" \
            "$package_dir/SliderGroups" \
            "$package_dir/SliderPresets"

          cd "$package_dir"
          cmake -E tar cf "$artifact_file" --format=zip -- .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ubuntu-gcc-relwithdebinfo.zip
          archive: false
          if-no-files-found: error
          retention-days: 7