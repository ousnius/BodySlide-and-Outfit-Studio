name: CMake RelWithDebInfo

on:
  push:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  windows-x64-relwithdebinfo:
    name: Windows x64 RelWithDebInfo
    runs-on: windows-2025-vs2026

    env:
      BUILD_TYPE: RelWithDebInfo
      VCPKG_TARGET_TRIPLET: x64-windows-static

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('.github/workflows/cmake-release.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics

      - name: Install dependencies
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $vcpkgCache = Join-Path $env:GITHUB_WORKSPACE "vcpkg-binary-cache"
          New-Item -ItemType Directory -Force -Path $vcpkgCache | Out-Null
          $env:VCPKG_BINARY_SOURCES = "clear;files,$vcpkgCache,readwrite"
          & (Join-Path $vcpkgRoot "vcpkg.exe") install "wxwidgets[debug-support]:$env:VCPKG_TARGET_TRIPLET" "catch2:$env:VCPKG_TARGET_TRIPLET"

      - name: Configure CMake
        shell: pwsh
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          $toolchainFile = Join-Path $vcpkgRoot "scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/windows-x64-relwithdebinfo `
            -G "Visual Studio 18 2026" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$toolchainFile" `
            "-DCMAKE_MAP_IMPORTED_CONFIG_RELWITHDEBINFO=RelWithDebInfo;Release;None;NOCONFIG" `
            -DVCPKG_TARGET_TRIPLET="$env:VCPKG_TARGET_TRIPLET" `
            -DBSOS_BUILD_TESTS=ON `
            -DBSOS_ENABLE_FBXSDK=OFF

      - name: Build
        shell: pwsh
        run: cmake --build build/windows-x64-relwithdebinfo --config "$env:BUILD_TYPE" --target BodySlide OutfitStudio BSOSTests --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build/windows-x64-relwithdebinfo -C "$env:BUILD_TYPE" --output-on-failure

      - name: Verify outputs
        shell: pwsh
        run: |
          $outputs = @(
            "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/BodySlide.exe",
            "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/OutfitStudio.exe"
          )

          foreach ($output in $outputs) {
            if (-not (Test-Path $output)) {
              Write-Error "Missing expected build output: $output"
            }
          }

      - name: Package artifacts
        shell: pwsh
        run: |
          $packageName = "BodySlide-and-Outfit-Studio-windows-x64-relwithdebinfo"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          $packageDir = Join-Path $artifactRoot $packageName
          $artifactFile = Join-Path $artifactRoot "windows-x64-relwithdebinfo.zip"

          Remove-Item -Recurse -Force $artifactRoot -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $packageDir | Out-Null

          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/BodySlide.exe" $packageDir
          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/OutfitStudio.exe" $packageDir
          Copy-Item "build/windows-x64-relwithdebinfo/$env:BUILD_TYPE/*.pdb" $packageDir -ErrorAction SilentlyContinue
          Copy-Item "res" $packageDir -Recurse
          Copy-Item "lang" $packageDir -Recurse

          foreach ($file in @("BodySlide.xml", "BuildSelection.xml", "Config.xml", "OutfitStudio.xml", "RefTemplates.xml")) {
            Copy-Item $file $packageDir
          }

          foreach ($directory in @("SliderSets", "Automations", "PoseData", "RefTemplates", "ShapeData", "SliderCategories", "SliderGroups", "SliderPresets")) {
            New-Item -ItemType Directory -Force -Path (Join-Path $packageDir $directory) | Out-Null
          }

          Push-Location $packageDir
          cmake -E tar cf $artifactFile --format=zip -- .
          Pop-Location

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/windows-x64-relwithdebinfo.zip
          archive: false
          if-no-files-found: error
          retention-days: 7



  ubuntu-gcc-relwithdebinfo:
    name: Ubuntu GCC RelWithDebInfo
    runs-on: ubuntu-latest

    env:
      BUILD_TYPE: RelWithDebInfo
      CC: gcc
      CXX: g++
      VCPKG_TARGET_TRIPLET: x64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Cache vcpkg binary packages
        uses: actions/cache@v5
        with:
          path: vcpkg-binary-cache
          key: vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-${{ hashFiles('.github/workflows/cmake-release.yml') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ env.VCPKG_TARGET_TRIPLET }}-

      - name: Bootstrap vcpkg
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          git clone https://github.com/microsoft/vcpkg.git "$vcpkg_root"
          "$vcpkg_root/bootstrap-vcpkg.sh" -disableMetrics

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autoconf \
            autoconf-archive \
            automake \
            build-essential \
            cmake \
            directx-headers-dev \
            g++ \
            gcc \
            libglew-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libx11-dev \
            libxext-dev \
            libxft-dev \
            libxi-dev \
            libxkbcommon-dev \
            libxrandr-dev \
            libltdl-dev \
            libtool \
            libxtst-dev \
            ninja-build \
            pkg-config

          vcpkg_root="$RUNNER_TEMP/vcpkg"
          vcpkg_cache="$GITHUB_WORKSPACE/vcpkg-binary-cache"
          mkdir -p "$vcpkg_cache"
          export VCPKG_BINARY_SOURCES="clear;files,$vcpkg_cache,readwrite"
          "$vcpkg_root/vcpkg" install \
            "wxwidgets:${VCPKG_TARGET_TRIPLET}" \
            "catch2:${VCPKG_TARGET_TRIPLET}"

      - name: Configure CMake
        run: |
          vcpkg_root="$RUNNER_TEMP/vcpkg"
          toolchain_file="$vcpkg_root/scripts/buildsystems/vcpkg.cmake"
          cmake -S . -B build/ubuntu-gcc-relwithdebinfo \
            -G Ninja \
            -DCMAKE_BUILD_TYPE="$BUILD_TYPE" \
            -DCMAKE_TOOLCHAIN_FILE="$toolchain_file" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TARGET_TRIPLET" \
            -DBSOS_BUILD_TESTS=ON \
            -DBSOS_ENABLE_FBXSDK=OFF

      - name: Build
        run: cmake --build build/ubuntu-gcc-relwithdebinfo --target BodySlide OutfitStudio BSOSTests --parallel

      - name: Test
        run: ctest --test-dir build/ubuntu-gcc-relwithdebinfo --output-on-failure

      - name: Verify outputs
        run: |
          test -x "build/ubuntu-gcc-relwithdebinfo/BodySlide"
          test -x "build/ubuntu-gcc-relwithdebinfo/OutfitStudio"

      - name: Package artifacts
        run: |
          package_name="BodySlide-and-Outfit-Studio-ubuntu-gcc-relwithdebinfo"
          artifact_root="$GITHUB_WORKSPACE/artifacts"
          package_dir="$artifact_root/$package_name"
          artifact_file="$artifact_root/ubuntu-gcc-relwithdebinfo.zip"

          rm -rf "$artifact_root"
          mkdir -p "$package_dir"

          cp "build/ubuntu-gcc-relwithdebinfo/BodySlide" "$package_dir/"
          cp "build/ubuntu-gcc-relwithdebinfo/OutfitStudio" "$package_dir/"
          cp -a res "$package_dir/"
          cp -a lang "$package_dir/"
          cp BodySlide.xml BuildSelection.xml Config.xml OutfitStudio.xml RefTemplates.xml "$package_dir/"

          mkdir -p \
            "$package_dir/SliderSets" \
            "$package_dir/Automations" \
            "$package_dir/PoseData" \
            "$package_dir/RefTemplates" \
            "$package_dir/ShapeData" \
            "$package_dir/SliderCategories" \
            "$package_dir/SliderGroups" \
            "$package_dir/SliderPresets"

          cd "$package_dir"
          cmake -E tar cf "$artifact_file" --format=zip -- .

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: artifacts/ubuntu-gcc-relwithdebinfo.zip
          archive: false
          if-no-files-found: error
          retention-days: 7